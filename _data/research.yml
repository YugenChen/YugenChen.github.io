job_market_paper:
  title: 'The Cure Can Be Worse Than the Disease: Network Design and Cost Sharing in Medicare'
  abstract: >-
    Pharmacy benefit managers (PBMs) negotiate with pharmacies and steer patients through cost sharing.
    I examine how losing a potential replacement for an incumbent preferred pharmacy affects these
    incentives. In a bargaining model, replacement threats and copay steering are imperfect substitutes:
    when preferred designations adjust slowly, losing a cost-competitive nonpreferred alternative widens
    the dispensing-cost difference between tiers, increasing the gains from steering toward preferred
    pharmacies. Using 2019–2022 generic prescription data from stand-alone Medicare Part D plans, I
    compare local markets around closing nonpreferred pharmacies that could replace preferred incumbents
    with markets around eligible pharmacies that close later in a dynamic difference-in-differences
    design. In the first post-closure quarter, the nonpreferred-minus-preferred out-of-pocket payment
    gap during initial coverage increases by $1.58 per 30-day supply, approximately 42 percent of the
    reference gap. The preferred-minus-nonpreferred prescription-count difference also increases early.
    Subsequent payment-gap estimates are smaller and statistically insignificant, while preferred
    designations gradually change. Payment-gap responses are small during the deductible phase,
    following preferred pharmacy closures, and in the vertically integrated CVS/Aetna/Caremark
    subsample. These findings suggest that supplier alternatives shape patient price incentives and that
    policies expanding preferred access should account for subsequent adjustments in cost sharing.
  paper_url: null
working_papers:
- title: Sticky Fingers? Retention of Negotiated Drug Discounts by Pharmacy Benefit Managers
  coauthors: Alice Chen and Darius Lakdawalla
  status: Working paper
  abstract: We study how confidential rebates affect producer surplus across the U.S. pharmaceutical supply
    chain. Using the July 11, 2019, rescission of a proposed rebate pass-through rule as an unanticipated
    shock, we estimate how investors value rebate confidentiality. The rescission increased market capitalization
    for PBMs with rebate aggregators by 6.86% and insurers without PBMs by 6.09%, while reducing market
    capitalization for brand-name manufacturers by 2.81%. Our estimates imply that PBMs retain only 1.9%
    to 7.4% of rebates, but that share represents 26% to 62% of PBM profits. Results are consistent with
    confidential rebates redistributing surplus from manufacturers to intermediaries without creating
    value and potentially leading to 3.7 fewer drug approvals annually.
  paper_url: null
- title: The Relationship Between Mortality and Unemployment in 36 OECD Countries
  status: Working paper
  abstract: This paper examines whether the relationship between unemployment and mortality varies over
    the business cycle and with the strength of social welfare systems, using data from 36 OECD countries
    from 1979–2016. I distinguish short- and long-term unemployment and estimate dynamic panel models
    using fixed effects, Difference GMM, System GMM, and bias-corrected LSDV. The results suggest that
    social welfare spending attenuates the association between unemployment fluctuations and mortality.
    A 1% increase in the expenditure-to-GDP ratio for incapacity and health programs reduces the mortality
    response associated with a 1% decline in unemployment by approximately 0.14% and 0.04%, respectively.
    The attenuation is particularly pronounced for long-term unemployment and becomes roughly four times
    larger in the long run.
  paper_url: null
