publications:
- title: Impact of Federal Global Health Spending on California’s Economy
  show_abstract: false
  venue: Forthcoming November 2026, California Global Health Leadership Initiative
  abstract: This report estimates the economic activity and patented innovation associated with U.S. federal
    global-health-related funding in California. Combining USAspending transaction records, BEA RIMS II
    input-output modeling, patent linkage and valuation, and two expert interviews, we identify $19.0
    billion in net federal obligations during 2016–2025. In 2024 dollars, $21.5 billion in obligations
    is associated with $30.2–$46.3 billion in output, $19.2–$28.6 billion in value added, and approximately
    157,000–239,000 job-years, depending on whether modeled household spending is included. Federal awards
    are also linked to 104 patents, or 49.37 patents after weighting by California inventor shares, with
    benchmark private values of $1.78 billion using mean KPSS estimates and $574 million using medians,
    both in 1982 dollars. Interviews illustrate how funding may sustain specialized research capacity
    and complementary financing. These estimates document the economic footprint and innovation associated
    with federal global-health-related funding.
  paper_url: null
